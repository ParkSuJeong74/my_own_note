vulnerabilities:
  # Gradio 6.30.0 requires pillow<13. CosyVoice's Web UI exposes Audio, Text,
  # Number, Radio and Dropdown components only, so Pillow image codecs are not
  # reachable from user input. Recheck when Gradio supports Pillow 13.
  - id: CVE-2026-112393
    purls: ["pkg:pypi/pillow@12.3.0"]
    expired_at: 2027-01-31
    statement: CosyVoice has no image input/output path; blocked by Gradio pillow<13 compatibility bound.
