  # Trivy also emits pathless duplicate package records. The same SBOM proves
  # the installed dist-info versions are msgpack 1.2.3, setuptools 84.0.0 and
  # urllib3 2.8.0; build-time assertions below keep that evidence executable.
  - id: GHSA-6v7p-g79w-8964
    purls: ["pkg:pypi/msgpack@1.1.2"]
    expired_at: 2027-01-31
    statement: Pathless duplicate; runtime distribution is asserted as msgpack 1.2.3.
  - id: CVE-2025-47273
    purls: ["pkg:pypi/setuptools@70.3.0"]
    expired_at: 2027-01-31
    statement: Pathless duplicate; runtime distribution is asserted as setuptools 84.0.0.
  - id: CVE-2026-97687
    purls: ["pkg:pypi/urllib3@2.7.0"]
    expired_at: 2027-01-31
    statement: Pathless duplicate; runtime distribution is asserted as urllib3 2.8.0.
  - id: CVE-2026-97689
    purls: ["pkg:pypi/urllib3@2.7.0"]
    expired_at: 2027-01-31
    statement: Pathless duplicate; runtime distribution is asserted as urllib3 2.8.0.
