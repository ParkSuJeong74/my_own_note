{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "easyopen-public",
      "folder": "EasyOpen",
      "interval": "1m",
      "rules": [
        {
          "uid": "easyopen-public-down",
          "title": "EasyOpen public endpoint down",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "expr": "1 - probe_success{project=\"easyopen\"}",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0.5
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "params": [],
                      "type": "last"
                    },
                    "type": "query"
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "B",
                "type": "threshold"
              }
            }
          ],
          "noDataState": "Alerting",
          "execErrState": "Alerting",
          "for": "10m",
          "isPaused": false,
          "annotations": {
            "summary": "EasyOpen endpoint failed for 10 minutes",
            "description": "Target: {{ $labels.instance }}. Check the EasyOpen Public Availability dashboard."
          },
          "labels": {
            "project": "easyopen",
            "alert_scope": "easyopen",
            "severity": "critical"
          }
        },
        {
          "uid": "easyopen-probe-scrape-down",
          "title": "EasyOpen probe collector unreachable",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "expr": "1 - up{job=~\"easyopen-public-.*\"}",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0.5
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "params": [],
                      "type": "last"
                    },
                    "type": "query"
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "B",
                "type": "threshold"
              }
            }
          ],
          "noDataState": "Alerting",
          "execErrState": "Alerting",
          "for": "10m",
          "isPaused": false,
          "annotations": {
            "summary": "Prometheus cannot collect EasyOpen probes",
            "description": "Target: {{ $labels.instance }}. Check the EasyOpen Public Availability dashboard."
          },
          "labels": {
            "project": "easyopen",
            "alert_scope": "easyopen",
            "severity": "critical"
          }
        },
        {
          "uid": "easyopen-probe-missing",
          "title": "EasyOpen monitoring data missing",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "expr": "(count(probe_success{project=\"easyopen\"}) or vector(0)) < bool 4",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0.5
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "params": [],
                      "type": "last"
                    },
                    "type": "query"
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "B",
                "type": "threshold"
              }
            }
          ],
          "noDataState": "Alerting",
          "execErrState": "Alerting",
          "for": "10m",
          "isPaused": false,
          "annotations": {
            "summary": "Fewer than four EasyOpen endpoints have monitoring data",
            "description": "Target: {{ $labels.instance }}. Check the EasyOpen Public Availability dashboard."
          },
          "labels": {
            "project": "easyopen",
            "alert_scope": "easyopen",
            "severity": "critical"
          }
        },
        {
          "uid": "easyopen-cert-expiring",
          "title": "EasyOpen TLS certificate expires soon",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "expr": "(probe_ssl_earliest_cert_expiry{project=\"easyopen\"} - time()) / 86400",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        14
                      ],
                      "type": "lt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "params": [],
                      "type": "last"
                    },
                    "type": "query"
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "B",
                "type": "threshold"
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Alerting",
          "for": "5m",
          "isPaused": false,
          "annotations": {
            "summary": "EasyOpen TLS certificate expires in less than 14 days",
            "description": "Target: {{ $labels.instance }}. Check the EasyOpen Public Availability dashboard."
          },
          "labels": {
            "project": "easyopen",
            "alert_scope": "easyopen",
            "severity": "warning"
          }
        },
        {
          "uid": "easyopen-cert-data-missing",
          "title": "EasyOpen TLS certificate data missing",
          "condition": "B",
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "expr": "(count(probe_ssl_earliest_cert_expiry{project=\"easyopen\"}) or vector(0)) < bool 4",
                "instant": true,
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "A"
              }
            },
            {
              "refId": "B",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "datasourceUid": "__expr__",
              "model": {
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0.5
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "B"
                      ]
                    },
                    "reducer": {
                      "params": [],
                      "type": "last"
                    },
                    "type": "query"
                  }
                ],
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200,
                "refId": "B",
                "type": "threshold"
              }
            }
          ],
          "noDataState": "Alerting",
          "execErrState": "Alerting",
          "for": "10m",
          "isPaused": false,
          "annotations": {
            "summary": "Fewer than four EasyOpen TLS certificates have monitoring data",
            "description": "Target: {{ $labels.instance }}. Check the EasyOpen Public Availability dashboard."
          },
          "labels": {
            "project": "easyopen",
            "alert_scope": "easyopen",
            "severity": "warning"
          }
        }
      ]
    }
  ]
}
