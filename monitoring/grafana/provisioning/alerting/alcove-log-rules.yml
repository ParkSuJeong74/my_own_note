apiVersion: 1

groups:
  - orgId: 1
    name: alcove-logs
    folder: Operations
    interval: 1m
    rules:
      - uid: alcove-api-http-5xx
        title: Alcove API HTTP 5xx detected
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({project="alcove",service_name="api"} | json | status >= 500 [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: "Alcove API returned an HTTP 5xx response"
          description: "5xx responses in the last 5 minutes: {{ printf \"%.0f\" $values.A.Value }}"
        labels: { severity: critical, project: alcove, service: api, alert_scope: alcove }

      - uid: alcove-api-error-logs
        title: Alcove API error logs detected
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({project="alcove",service_name="api"} | json | level=~"error|fatal" [5m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Alerting
        for: 0s
        annotations:
          summary: "Alcove API emitted error or fatal logs"
          description: "Error/fatal log lines in the last 5 minutes: {{ printf \"%.0f\" $values.A.Value }}"
        labels: { severity: warning, project: alcove, service: api, alert_scope: alcove }
