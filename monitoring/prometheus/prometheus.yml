global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: postgres
    static_configs:
      - targets: ["alcove-postgres-exporter:9187"]
        labels:
          project: alcove
      - targets: ["tono-postgres-exporter:9187"]
        labels:
          project: tono

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.world-alcove.com/api/health-check/readiness
        labels:
          project: alcove
          service: api
      - targets:
          - http://tono_ai:8000/api/v1/health
        labels:
          project: tono
          service: ai
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
