global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: postgres
    static_configs:
      - targets: ["alcove-postgres-exporter:9187"]
        labels:
          project: alcove
      - targets: ["tono-postgres-exporter:9187"]
        labels:
          project: tono
      - targets: ["n8n-postgres-exporter:9187"]
        labels:
          project: mano
      - targets: ["mano-admin-postgres-exporter:9187"]
        labels:
          project: mano-admin

  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: ["n8n:5678"]
        labels:
          project: mano
          service: n8n

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://api.world-alcove.com/api/health-check/readiness
        labels:
          project: alcove
          service: api
      - targets:
          - http://tono_ai:8000/api/v1/health
        labels:
          project: tono
          service: ai
      - targets:
          - http://grafana:3000/api/health
        labels:
          project: mano
          service: grafana
      - targets:
          - http://filebrowser:80
        labels:
          project: mano
          service: filebrowser
      - targets:
          - http://minio:9000/minio/health/live
        labels:
          project: mano
          service: minio
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: easyopen-public-web
    scrape_interval: 5m
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [easyopen_web]
    static_configs:
      - targets: ["https://easy-open.mano.io.kr/"]
        labels:
          project: easyopen
          service: web-home
      - targets: ["https://easy-open.mano.io.kr/download/"]
        labels:
          project: easyopen
          service: web-download
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: easyopen-public-sitemap
    scrape_interval: 5m
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [easyopen_sitemap]
    static_configs:
      - targets: ["https://easy-open.mano.io.kr/sitemap.xml"]
        labels:
          project: easyopen
          service: web-sitemap
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: easyopen-public-api
    scrape_interval: 5m
    scrape_timeout: 15s
    metrics_path: /probe
    params:
      module: [easyopen_api]
    static_configs:
      - targets: ["https://easyopen-api.mano.io.kr/api/health"]
        labels:
          project: easyopen
          service: api
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
