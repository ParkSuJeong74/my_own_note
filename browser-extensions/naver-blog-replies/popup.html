<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mano 블로그 동기화</title><link rel="stylesheet" href="popup.css"></head><body><main><h1>Mano 블로그 동기화</h1><p>글 화면에서는 댓글을 자동으로 펼쳐 수집하고, 이웃 관리 화면에서는 관계를 구분해 동기화해요.</p><label>Mano 주소<input id="baseUrl" type="url" value="https://admin.mano.io.kr"></label><label>수집 토큰<input id="token" type="password" autocomplete="off"></label><label>내 네이버 블로그 ID<input id="ownerBlogId" autocomplete="off" placeholder="blog.naver.com/뒤의 ID"></label><button id="save" class="secondary">설정 저장</button><button id="collect">댓글 자동 열고 수집</button><button id="neighbors">이웃 관계 동기화</button><button id="growth">성장 지표 동기화</button><output id="status">대기 중</output><small>네이버 쿠키와 전체 페이지 HTML은 전송하지 않으며 실제 댓글·이웃 신청을 수행하지 않습니다.</small></main><script src="popup.js"></script></body></html>
