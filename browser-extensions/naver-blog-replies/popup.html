<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Mano 블로그 동기화</title><link rel="stylesheet" href="popup.css"></head><body><main><h1>Mano 블로그 동기화</h1><p>현재 연 네이버 화면에 맞는 수집 버튼을 눌러 주세요.</p><output id="status" aria-live="polite">대기 중</output><label>Mano 주소<input id="baseUrl" type="url" value="https://admin.mano.io.kr"></label><label>수집 토큰<input id="token" type="password" autocomplete="off"></label><label>내 네이버 블로그 ID<input id="ownerBlogId" autocomplete="off" placeholder="blog.naver.com/뒤의 ID"></label><button id="save" class="secondary">설정 저장</button><button id="collect">현재 글 댓글 수집</button><button id="managed-comments">댓글 관리 전체 수집</button><div class="neighbor-buttons"><button data-neighbor-scope="FOLLOWING">내가 추가한 이웃 수집</button><button data-neighbor-scope="FOLLOWERS">나를 추가한 이웃 수집</button><button data-neighbor-scope="REQUESTS">서로이웃 신청 수집</button></div><button id="growth">성장 지표 동기화</button><small>네이버 쿠키와 전체 페이지 HTML은 전송하지 않으며 실제 댓글·이웃 신청을 수행하지 않습니다.</small></main><script type="module" src="popup.js"></script></body></html>
