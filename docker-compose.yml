x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ─────────────────────────────────────────
  # Nginx Proxy Manager - 도메인 라우팅
  # ─────────────────────────────────────────
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.12.3
    container_name: nginx-proxy-manager
    restart: unless-stopped

    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:81:81"

    environment:
      TZ: UTC

    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt

    networks:
      - proxy

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

  # ─────────────────────────────────────────
  # File Browser - 개인 파일 서버
  # ─────────────────────────────────────────
  filebrowser:
    image: filebrowser/filebrowser:v2.31.2
    container_name: filebrowser
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:80"

    environment:
      TZ: UTC

    volumes:
      - /srv/filebrowser/files:/srv
      - /srv/filebrowser/config/database.db:/database.db

    networks:
      - proxy

    mem_limit: 512m
    cpus: 0.5

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

  # ─────────────────────────────────────────
  # Mano Admin - 조회 전용 홈서버 관제 포털
  # ─────────────────────────────────────────
  mano-admin:
    build:
      context: ./mano-admin
    image: mano-admin:local
    container_name: mano-admin
    restart: unless-stopped

    ports:
      - "127.0.0.1:3100:3000"

    environment:
      PROMETHEUS_URL: http://prometheus:9090
      FILE_BROWSER_URL: ${FILE_BROWSER_URL:-https://files.mano.io.kr}
      GRAFANA_URL: ${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL is required}
      MINIO_CONSOLE_URL: ${MINIO_CONSOLE_URL:-https://minio-admin.mano.io.kr}
      TZ: Asia/Seoul

    networks:
      - proxy
      - monitoring

    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    labels:
      monitoring.logs: "true"
      monitoring.project: "mano"
      monitoring.service: "admin"

    logging: *default-logging

  # ─────────────────────────────────────────
  # n8n - 개인 자동화 서버
  # File Browser의 automation 전용 디렉터리만 공유한다.
  # ─────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.3
    container_name: n8n
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:5678:5678"

    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_HOST: ${N8N_HOST:?N8N_HOST is required}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:?N8N_EDITOR_BASE_URL is required}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?N8N_WEBHOOK_URL is required}
      N8N_PROXY_HOPS: "1"
      N8N_METRICS: "true"
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-Asia/Seoul}
      TZ: ${N8N_TIMEZONE:-Asia/Seoul}

    volumes:
      - n8n_data:/home/node/.n8n
      - /srv/filebrowser/files/automation:/files

    networks:
      - proxy
      - automation
      - monitoring

    mem_limit: 1g
    cpus: 1.0

    security_opt:
      - no-new-privileges:true

    labels:
      monitoring.logs: "true"
      monitoring.project: "mano"
      monitoring.service: "n8n"

    logging: *default-logging

  n8n-postgres:
    image: postgres:16.10-alpine
    container_name: n8n-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required}
      TZ: UTC

    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data

    networks:
      - automation

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    mem_limit: 512m
    cpus: 0.5

    security_opt:
      - no-new-privileges:true

    labels:
      monitoring.logs: "true"
      monitoring.project: "mano"
      monitoring.service: "n8n-postgres"

    logging: *default-logging

  n8n-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: n8n-postgres-exporter
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy

    environment:
      DATA_SOURCE_URI: n8n-postgres:5432/${N8N_DB_NAME:-n8n}?sslmode=disable
      DATA_SOURCE_USER: ${N8N_DB_USER:-n8n}
      DATA_SOURCE_PASS: ${N8N_DB_PASSWORD:?N8N_DB_PASSWORD is required}

    networks:
      - automation
      - monitoring

    mem_limit: 128m
    cpus: 0.25

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

  # ─────────────────────────────────────────
  # MinIO - 프로젝트 공용 S3 호환 오브젝트 스토리지
  # 프로젝트별로 버킷을 분리해서 사용한다.
  # ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    command: server /data --console-address ':9001'

    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-https://tono.mano.io.kr,https://world-alcove.com,http://localhost:3000,http://localhost:3001}
      TZ: UTC

    volumes:
      - minio_data:/data

    networks:
      - proxy

    mem_limit: 1g
    cpus: 1.0

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

  # ─────────────────────────────────────────
  # Cloudflare Tunnel - Mano 계정
  # ─────────────────────────────────────────
  cloudflared-mano:
    image: cloudflare/cloudflared:2025.5.0
    container_name: cloudflared-mano
    restart: unless-stopped

    command: tunnel --protocol http2 --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}

    environment:
      TZ: UTC

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - proxy

    mem_limit: 256m
    cpus: 0.5

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

  # ─────────────────────────────────────────
  # Cloudflare Tunnel - Alcove 계정
  # ─────────────────────────────────────────
  cloudflared-alcove:
    image: cloudflare/cloudflared:2025.5.0
    container_name: cloudflared-alcove
    restart: unless-stopped

    command: tunnel --protocol http2 --no-autoupdate run --token ${CLOUDFLARE_ALCOVE_TUNNEL_TOKEN:?CLOUDFLARE_ALCOVE_TUNNEL_TOKEN is required}

    environment:
      TZ: UTC

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - proxy

    mem_limit: 256m
    cpus: 0.5

    security_opt:
      - no-new-privileges:true

    logging: *default-logging

  # ─────────────────────────────────────────
  # Monitoring - Grafana / Loki / Prometheus
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL is required}
      SLACK_ALCOVE_WEBHOOK_URL: ${SLACK_ALCOVE_WEBHOOK_URL:?SLACK_ALCOVE_WEBHOOK_URL is required}
      DISCORD_TONO_WEBHOOK_URL: ${DISCORD_TONO_WEBHOOK_URL:?DISCORD_TONO_WEBHOOK_URL is required}
      TZ: UTC
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - proxy
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  loki:
    image: grafana/loki:3.7.0
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: alloy
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring
      - proxy
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  n8n_data:
  n8n_postgres_data:
  minio_data:
  npm_data:
  npm_letsencrypt:
  grafana_data:
  loki_data:
  alloy_data:
  prometheus_data:

networks:
  proxy:
    name: my_own_note_proxy
    driver: bridge
  monitoring:
    name: my_own_note_monitoring
    driver: bridge
  automation:
    name: my_own_note_automation
    driver: bridge
    internal: true
