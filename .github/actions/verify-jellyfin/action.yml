name: Verify Jellyfin supply chain
description: Validate the locked upstream manifest, scan both architectures, and upload evidence.

runs:
  using: composite
  steps:
    - name: Resolve and validate locked image
      id: image
      shell: bash
      run: |
        set -euo pipefail
        lock="easyopen/containers/jellyfin/image-lock.json"
        source="$(jq -r '.repository + "@" + .digest' "$lock")"
        amd64="$(jq -r '.repository + "@" + .platformDigests["linux/amd64"]' "$lock")"
        arm64="$(jq -r '.repository + "@" + .platformDigests["linux/arm64"]' "$lock")"
        candidate="$(jq -r '.candidateRepository' "$lock")"
        if [[ ! "$source" =~ ^ghcr\.io/jellyfin/jellyfin@sha256:[a-f0-9]{64}$ ]]; then
          echo "The upstream image is not an approved Jellyfin GHCR digest." >&2
          exit 1
        fi
        if [[ ! "$candidate" =~ ^ghcr\.io/[a-z0-9-]+/easyopen-app-jellyfin$ ]]; then
          echo "The candidate repository is not an approved EasyOpen GHCR path." >&2
          exit 1
        fi
        for platform_image in "$amd64" "$arm64"; do
          if [[ ! "$platform_image" =~ ^ghcr\.io/jellyfin/jellyfin@sha256:[a-f0-9]{64}$ ]]; then
            echo "A platform image is not an approved Jellyfin GHCR digest." >&2
            exit 1
          fi
        done
        test "$(jq -r '.license' "$lock")" = "GPL-2.0"
        test -s easyopen/containers/jellyfin/COMPLIANCE.md
        echo "source=$source" >> "$GITHUB_OUTPUT"
        echo "amd64=$amd64" >> "$GITHUB_OUTPUT"
        echo "arm64=$arm64" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3.11.1

    - name: Verify locked multi-architecture manifest
      shell: bash
      env:
        SOURCE_IMAGE: ${{ steps.image.outputs.source }}
        AMD64_IMAGE: ${{ steps.image.outputs.amd64 }}
        ARM64_IMAGE: ${{ steps.image.outputs.arm64 }}
      run: |
        set -euo pipefail
        docker buildx imagetools inspect "$SOURCE_IMAGE" > manifest.txt
        grep -q 'Platform:.*linux/amd64' manifest.txt
        grep -q 'Platform:.*linux/arm64' manifest.txt
        grep -q "${AMD64_IMAGE#*@}" manifest.txt
        grep -q "${ARM64_IMAGE#*@}" manifest.txt

    - name: Build amd64 security candidate for scanning
      shell: bash
      env:
        SOURCE_IMAGE: ${{ steps.image.outputs.source }}
      run: |
        set -euo pipefail
        docker buildx build \
          --platform linux/amd64 \
          --build-arg "JELLYFIN_IMAGE=$SOURCE_IMAGE" \
          --file easyopen/containers/jellyfin/Dockerfile \
          --load \
          --tag easyopen-jellyfin-scan:amd64 \
          easyopen/containers/jellyfin

    - name: Scan amd64 fixed HIGH and CRITICAL vulnerabilities
      id: scan-amd64
      continue-on-error: true
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: easyopen-jellyfin-scan:amd64
        format: table
        output: trivy-amd64.txt
        exit-code: "1"
        ignore-unfixed: true
        scanners: vuln
        vuln-type: os,library
        severity: HIGH,CRITICAL
        timeout: 20m0s

    - name: Generate amd64 CycloneDX SBOM
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: easyopen-jellyfin-scan:amd64
        format: cyclonedx
        output: jellyfin-amd64.cdx.json
        exit-code: "0"
        scanners: vuln
        timeout: 20m0s

    - name: Build arm64 security candidate for scanning
      shell: bash
      env:
        SOURCE_IMAGE: ${{ steps.image.outputs.source }}
      run: |
        set -euo pipefail
        docker buildx build \
          --platform linux/arm64 \
          --build-arg "JELLYFIN_IMAGE=$SOURCE_IMAGE" \
          --file easyopen/containers/jellyfin/Dockerfile \
          --load \
          --tag easyopen-jellyfin-scan:arm64 \
          easyopen/containers/jellyfin

    - name: Scan arm64 fixed HIGH and CRITICAL vulnerabilities
      id: scan-arm64
      continue-on-error: true
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: easyopen-jellyfin-scan:arm64
        format: table
        output: trivy-arm64.txt
        exit-code: "1"
        ignore-unfixed: true
        scanners: vuln
        vuln-type: os,library
        severity: HIGH,CRITICAL
        timeout: 20m0s

    - name: Generate arm64 CycloneDX SBOM
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: easyopen-jellyfin-scan:arm64
        format: cyclonedx
        output: jellyfin-arm64.cdx.json
        exit-code: "0"
        scanners: vuln
        timeout: 20m0s

    - name: Assemble verification evidence
      shell: bash
      run: |
        set -euo pipefail
        cp easyopen/containers/jellyfin/image-lock.json .
        cp easyopen/containers/jellyfin/COMPLIANCE.md .

    - name: Upload verification evidence
      uses: actions/upload-artifact@v4
      with:
        name: easyopen-jellyfin-verification-${{ github.sha }}
        path: |
          manifest.txt
          image-lock.json
          COMPLIANCE.md
          trivy-amd64.txt
          trivy-arm64.txt
          jellyfin-amd64.cdx.json
          jellyfin-arm64.cdx.json
        if-no-files-found: error
        retention-days: 30

    - name: Reject fixed HIGH and CRITICAL vulnerabilities
      if: ${{ steps.scan-amd64.outcome != 'success' || steps.scan-arm64.outcome != 'success' }}
      shell: bash
      run: |
        echo "A fixed HIGH or CRITICAL vulnerability blocks this candidate." >&2
        exit 1
