name: "[AUTO] EasyOpen · Validate"
run-name: "[AUTO] EasyOpen validate · ${{ github.event_name }} · ${{ github.ref_name }}"

on:
  push:
    branches:
      - master
    paths:
      - "easyopen-desktop/**"
      - "easyopen-android/**"
      - "easyopen-catalog/**"
      - "easyopen-containers/**"
      - ".github/workflows/easyopen-*.yml"
  pull_request:
    paths:
      - "easyopen-desktop/**"
      - "easyopen-android/**"
      - "easyopen-catalog/**"
      - "easyopen-containers/**"
      - ".github/workflows/easyopen-*.yml"

permissions:
  contents: read

concurrency:
  group: easyopen-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyopen-desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: easyopen-desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyopen-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: easyopen-android/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Expo compatibility
        run: npx expo install --check
      - name: Test
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build Android bundle
        run: npm run build
