name: "[AUTO] EasyOpen · Validate"
run-name: "[AUTO] EasyOpen validate · ${{ github.event_name }} · ${{ github.ref_name }}"

on:
  push:
    branches:
      - master
    paths:
      - "easyopen/apps/desktop/**"
      - "easyopen/apps/mobile/**"
      - "easyopen/apps/catalog/**"
      - "easyopen/containers/**"
      - ".github/workflows/easyopen-*.yml"
  pull_request:
    paths:
      - "easyopen/apps/desktop/**"
      - "easyopen/apps/mobile/**"
      - "easyopen/apps/catalog/**"
      - "easyopen/containers/**"
      - ".github/workflows/easyopen-*.yml"

permissions:
  contents: read

concurrency:
  group: easyopen-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  jellyfin-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Jellyfin supply-chain changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "jellyfin=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
            easyopen/containers/jellyfin \
            easyopen/apps/catalog/container-images.json \
            easyopen/apps/desktop/resources/container-images.json \
            .github/actions/verify-jellyfin \
            .github/workflows/easyopen-jellyfin-publish.yml | grep -q .; then
            echo "jellyfin=true" >> "$GITHUB_OUTPUT"
          else
            echo "jellyfin=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Jellyfin supply chain
        if: ${{ steps.changes.outputs.jellyfin == 'true' }}
        uses: ./.github/actions/verify-jellyfin

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyopen/apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: easyopen/apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyopen/apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: easyopen/apps/mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Expo compatibility
        run: npx expo install --check
      - name: Test
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build Android bundle
        run: npm run build
