name: EasyOpen mobile screen update
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: easyopen-mobile-ota-production
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EASYOPEN_EAS_PROJECT_ID: ${{ vars.EASYOPEN_EAS_PROJECT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    defaults:
      run:
        working-directory: easyopen/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: easyopen/apps/mobile/package-lock.json
      - name: Require configured update channel
        run: |
          test -n "$EASYOPEN_EAS_PROJECT_ID"
          test -n "$EXPO_TOKEN"
      - run: npm ci
      - run: npx expo install --check
      - run: npm test
      - run: npm run typecheck
      - run: npm run sync:catalog
      - name: Publish compatible screen update
        run: npx --yes eas-cli@27.11.0 update --channel production --platform all --message "EasyOpen ${{ github.sha }}" --non-interactive
