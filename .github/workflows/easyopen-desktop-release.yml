name: "[MANUAL] EasyOpen · Build/Release Desktop/Android apps"
run-name: "[MANUAL] EasyOpen apps · scope=${{ inputs.release_scope }} · publish=${{ inputs.publish }} · ${{ inputs.release_tag }}"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "false: build artifacts only · true: create tag and prerelease"
        required: true
        default: false
        type: boolean
      release_scope:
        description: "all: signed Desktop + Android · android: Android only · test-all: unsigned Desktop test + signed Android"
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - test-all
      release_tag:
        description: "Candidate label or GitHub prerelease tag (must match Desktop package version)"
        required: true
        default: "easyopen-v0.1.1-beta.2"
        type: string

permissions:
  contents: read

concurrency:
  group: easyopen-app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.publish }}" == "true" && "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "GitHub prerelease publishing is allowed only from refs/heads/master." >&2
            exit 1
          fi
          version=$(node -p "require('./easyopen/apps/desktop/package.json').version")
          mobile_version=$(node -p "require('./easyopen/apps/mobile/package.json').version")
          expo_version=$(node -p "require('./easyopen/apps/mobile/app.json').expo.version")
          if [[ "$mobile_version" != "$version" || "$expo_version" != "$version" ]]; then
            echo "Desktop, Android package, and Expo versions must match: $version / $mobile_version / $expo_version" >&2
            exit 1
          fi
          release_tag="$REQUESTED_TAG"
          if [[ "$release_tag" != "easyopen-v${version}" ]]; then
            echo "Release tag $release_tag does not match package version $version" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  package-windows:
    if: inputs.release_scope != 'android'
    needs: release-metadata
    runs-on: windows-latest
    defaults:
      run:
        working-directory: easyopen/apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: easyopen/apps/desktop/package-lock.json

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "easyopen-v$packageVersion") {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Install Doppler CLI
        if: inputs.publish && inputs.release_scope == 'all'
        uses: dopplerhq/cli-action@v4

      - name: Load Windows release secrets from Doppler mano/prd
        if: inputs.publish && inputs.release_scope == 'all'
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          bash ../../../.github/scripts/export-doppler-secrets.sh
          WINDOWS_CERTIFICATE_BASE64
          WINDOWS_CERTIFICATE_PASSWORD
          WINDOWS_EXPECTED_PUBLISHER

      - name: Require Windows signing secrets for publishing
        if: inputs.publish && inputs.release_scope == 'all'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_EXPECTED_PUBLISHER)) {
            throw "Publishing requires WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD, and WINDOWS_EXPECTED_PUBLISHER secrets."
          }

      - name: Package Windows app
        shell: pwsh
        run: |
          $env:CSC_LINK = $env:WINDOWS_CERTIFICATE_BASE64
          $env:CSC_KEY_PASSWORD = $env:WINDOWS_CERTIFICATE_PASSWORD
          $env:CSC_IDENTITY_AUTO_DISCOVERY = "${{ inputs.release_scope == 'all' }}"
          npm run package:win -- --config.extraMetadata.easyopenUpdates=${{ inputs.publish && inputs.release_scope == 'all' }}

      - name: Verify published Windows signature
        if: inputs.publish && inputs.release_scope == 'all'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/EasyOpen-*-Setup.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Invalid Authenticode signature: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notlike "*$env:WINDOWS_EXPECTED_PUBLISHER*") {
            throw "Unexpected Windows publisher: $($signature.SignerCertificate.Subject)"
          }

      - name: Remove Windows update metadata from unsigned test build
        if: inputs.release_scope == 'test-all'
        shell: pwsh
        run: |
          Get-ChildItem release -Include '*.blockmap','*.yml' -Recurse |
            Remove-Item -Force

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-windows
          path: |
            easyopen/apps/desktop/release/EasyOpen-*-Setup.exe
            easyopen/apps/desktop/release/EasyOpen-*-Setup.exe.blockmap
            easyopen/apps/desktop/release/*.yml
          if-no-files-found: error

  package-android:
    needs: release-metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyopen/apps/mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: easyopen/apps/mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Doppler CLI
        if: inputs.publish
        uses: dopplerhq/cli-action@v4

      - name: Load Android release secrets from Doppler mano/prd
        if: inputs.publish
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          bash ../../../.github/scripts/export-doppler-secrets.sh
          EASYOPEN_ANDROID_KEYSTORE_BASE64
          EASYOPEN_ANDROID_KEY_ALIAS
          EASYOPEN_ANDROID_KEYSTORE_PASSWORD
          EASYOPEN_ANDROID_KEY_PASSWORD

      - name: Validate Android signing secrets
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EASYOPEN_ANDROID_KEYSTORE_BASE64"
          test -n "$EASYOPEN_ANDROID_KEY_ALIAS"
          test -n "$EASYOPEN_ANDROID_KEYSTORE_PASSWORD"
          test -n "$EASYOPEN_ANDROID_KEY_PASSWORD"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Restore release keystore
        if: inputs.publish
        shell: bash
        run: printf '%s' "$EASYOPEN_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easyopen-release.jks"

      - name: Build signed release APK and Play Store bundle
        if: inputs.publish
        shell: bash
        env:
          EASYOPEN_KEYSTORE_PATH: ${{ runner.temp }}/easyopen-release.jks
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify signed Play Store bundle
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          keystore="${{ runner.temp }}/easyopen-release.jks"
          test -s "$bundle"
          unzip -t "$bundle"
          verification=$(jarsigner -verify "$bundle" 2>&1)
          printf '%s\n' "$verification"
          grep -Fq 'jar verified.' <<< "$verification"

          expected_fingerprint=$(keytool -list -v \
            -keystore "$keystore" \
            -storepass "$EASYOPEN_KEYSTORE_PASSWORD" \
            -alias "$EASYOPEN_KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          bundle_fingerprint=$(keytool -printcert -jarfile "$bundle" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          test -n "$expected_fingerprint"
          test "$bundle_fingerprint" = "$expected_fingerprint"

      - name: Build internal debug APK
        if: ${{ !inputs.publish }}
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Name Android packages
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            mv android/app/build/outputs/apk/release/app-release.apk "EasyOpen-Android-${RELEASE_TAG#easyopen-v}.apk"
            mv android/app/build/outputs/bundle/release/app-release.aab "EasyOpen-Android-${RELEASE_TAG#easyopen-v}-play.aab"
          else
            mv android/app/build/outputs/apk/debug/app-debug.apk "EasyOpen-Android-${RELEASE_TAG#easyopen-v}-internal-debug.apk"
          fi

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-android
          path: |
            easyopen/apps/mobile/EasyOpen-Android-*.apk
            easyopen/apps/mobile/EasyOpen-Android-*.aab
          if-no-files-found: error

  package-macos:
    if: inputs.release_scope != 'android'
    needs: release-metadata
    runs-on: macos-latest
    defaults:
      run:
        working-directory: easyopen/apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: easyopen/apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Install Doppler CLI
        if: inputs.publish && inputs.release_scope == 'all'
        uses: dopplerhq/cli-action@v4

      - name: Load macOS release secrets from Doppler mano/prd
        if: inputs.publish && inputs.release_scope == 'all'
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >-
          bash ../../../.github/scripts/export-doppler-secrets.sh
          MAC_CSC_LINK
          MAC_CSC_KEY_PASSWORD
          APPLE_ID
          APPLE_APP_SPECIFIC_PASSWORD
          APPLE_TEAM_ID

      - name: Require macOS signing and notarization secrets for publishing
        if: inputs.publish && inputs.release_scope == 'all'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAC_CSC_LINK"
          test -n "$MAC_CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Package unsigned macOS test DMG
        if: ${{ !inputs.publish || inputs.release_scope == 'test-all' }}
        run: npm run package:mac:unsigned

      - name: Package, sign, and notarize macOS DMG
        if: inputs.publish && inputs.release_scope == 'all'
        run: |
          export CSC_LINK="$MAC_CSC_LINK"
          export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
          npm run package:mac -- --config.extraMetadata.easyopenUpdates=true

      - name: Verify signed and notarized macOS app
        if: inputs.publish && inputs.release_scope == 'all'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find release -maxdepth 3 -type d -name 'EasyOpen.app' -print -quit)
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Remove macOS update metadata from unsigned test build
        if: inputs.release_scope == 'test-all'
        shell: bash
        run: rm -f release/*.zip release/*.blockmap release/*-mac.yml

      - name: Upload macOS update artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-macos
          path: |
            easyopen/apps/desktop/release/EasyOpen-*-arm64.dmg
            easyopen/apps/desktop/release/EasyOpen-*-arm64.zip
            easyopen/apps/desktop/release/EasyOpen-*-arm64.zip.blockmap
            easyopen/apps/desktop/release/*-mac.yml
          if-no-files-found: error

  prepare-release-assets:
    needs: [release-metadata, package-windows, package-macos, package-android]
    if: >-
      ${{
        always() &&
        needs.release-metadata.result == 'success' &&
        needs.package-android.result == 'success' &&
        (
          inputs.release_scope == 'android' ||
          (needs.package-windows.result == 'success' && needs.package-macos.result == 'success')
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out release packaging tools
        uses: actions/checkout@v4

      - name: Download packaged apps
        uses: actions/download-artifact@v4
        with:
          pattern: easyopen-*
          path: release-assets
          merge-multiple: true

      - name: Generate Homebrew Cask candidate
        if: inputs.release_scope != 'android'
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#easyopen-v}"
          dmg="release-assets/EasyOpen-${version}-arm64.dmg"
          test -s "$dmg"
          sha="$(sha256sum "$dmg" | awk '{print $1}')"
          node easyopen/packaging/homebrew/render-cask.mjs "$version" "$sha" > release-assets/easyopen.rb

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: sha256sum EasyOpen-* > SHA256SUMS.txt

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-release-candidate-${{ needs.release-metadata.outputs.release_tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  create-prerelease:
    needs: [release-metadata, prepare-release-assets]
    if: >-
      ${{
        always() &&
        inputs.publish &&
        needs.release-metadata.result == 'success' &&
        needs.prepare-release-assets.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: easyopen-release-candidate-${{ needs.release-metadata.outputs.release_tag }}
          path: release-assets

      - name: Create or refresh public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          {
            echo '## EasyOpen beta'
            echo
            echo 'Beta build for controlled testing. Every included platform still requires real-device validation.'
            echo
            if compgen -G 'release-assets/*.exe' >/dev/null; then
              if [[ "$RELEASE_SCOPE" == 'test-all' ]]; then
                echo '- Windows EXE is an unsigned personal test build. Automatic updates are disabled.'
              else
                echo '- Windows EXE is signed with the configured EasyOpen publisher certificate.'
              fi
            fi
            if compgen -G 'release-assets/*.dmg' >/dev/null; then
              if [[ "$RELEASE_SCOPE" == 'test-all' ]]; then
                echo '- macOS DMG is an unsigned and unnotarized personal test build. Automatic updates are disabled.'
              else
                echo '- macOS DMG is signed with Developer ID and notarized.'
              fi
            fi
            echo '- Android APK and Play Console AAB are signed with the configured EasyOpen upload key.'
            echo '- Upload the `*-play.aab` file to Google Play Console; the APK remains the GitHub installation fallback.'
            echo '- Verify downloads against `SHA256SUMS.txt`.'
            echo '- Android installation and store testing remain required.'
          } > release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_prerelease="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
            if [[ "$is_prerelease" != 'true' ]]; then
              echo "Release $RELEASE_TAG is no longer a prerelease and will not be overwritten." >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EasyOpen $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "EasyOpen $RELEASE_TAG" \
              --notes-file release-notes.md \
              --prerelease
          fi
