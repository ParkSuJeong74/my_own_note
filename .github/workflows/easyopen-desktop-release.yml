name: Release EasyOpen apps

on:
  push:
    branches:
      - master
    paths:
      - "easyopen-desktop/**"
      - "easyopen-android/**"
      - ".github/workflows/easyopen-desktop-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (must match easyopen-desktop/package.json version)"
        required: true
        default: "easyopen-v0.1.0-beta.1"
        type: string

permissions:
  contents: write

concurrency:
  group: easyopen-app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./easyopen-desktop/package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="easyopen-v${version}-beta.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$release_tag" =~ ^easyopen-v${version}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $release_tag does not match package version $version" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  package-windows:
    needs: release-metadata
    runs-on: windows-latest
    defaults:
      run:
        working-directory: easyopen-desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: easyopen-desktop/package-lock.json

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch "^easyopen-v$([regex]::Escape($packageVersion))(-[0-9A-Za-z.-]+)?$") {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Package unsigned Windows beta
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-windows
          path: easyopen-desktop/release/EasyOpen-*-Setup.exe
          if-no-files-found: error

  package-android:
    needs: release-metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyopen-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: easyopen-android/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Android signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.EASYOPEN_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easyopen-release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          EASYOPEN_KEYSTORE_PATH: ${{ runner.temp }}/easyopen-release.jks
          EASYOPEN_KEY_ALIAS: ${{ secrets.EASYOPEN_ANDROID_KEY_ALIAS }}
          EASYOPEN_KEYSTORE_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_PASSWORD }}
          EASYOPEN_KEY_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Name Android APK
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: mv android/app/build/outputs/apk/release/app-release.apk "EasyOpen-Android-${RELEASE_TAG#easyopen-v}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-android
          path: easyopen-android/EasyOpen-Android-*.apk
          if-no-files-found: error

  create-prerelease:
    needs: [release-metadata, package-windows, package-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v4
        with:
          pattern: easyopen-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: sha256sum EasyOpen-* > SHA256SUMS.txt

      - name: Create public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          cat > release-notes.md <<'EOF'
          ## EasyOpen beta

          Beta build for controlled testing. Both platforms still require real-device validation.

          - Windows EXE is unsigned and may show an unrecognized publisher warning.
          - Android APK is signed with the configured EasyOpen release key.
          - Verify downloads against `SHA256SUMS.txt`.
          - Windows 11 installation/update/removal and Galaxy installation/store-link testing remain required.
          EOF
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EasyOpen $RELEASE_TAG" \
            --notes-file release-notes.md \
            --prerelease
