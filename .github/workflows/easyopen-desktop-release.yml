name: "[MANUAL] EasyOpen · Build/Release Desktop/Android apps"
run-name: "[MANUAL] EasyOpen apps · publish=${{ inputs.publish }} · ${{ inputs.release_tag }}"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "false: build artifacts only · true: create tag and prerelease"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Candidate label or GitHub prerelease tag (must match Desktop package version)"
        required: true
        default: "easyopen-v0.1.0-beta.1"
        type: string

permissions:
  contents: read

concurrency:
  group: easyopen-app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.publish }}" == "true" && "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "GitHub prerelease publishing is allowed only from refs/heads/master." >&2
            exit 1
          fi
          version=$(node -p "require('./easyopen-desktop/package.json').version")
          release_tag="$REQUESTED_TAG"
          if [[ ! "$release_tag" =~ ^easyopen-v${version}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $release_tag does not match package version $version" >&2
            exit 1
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  package-windows:
    needs: release-metadata
    runs-on: windows-latest
    defaults:
      run:
        working-directory: easyopen-desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: easyopen-desktop/package-lock.json

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch "^easyopen-v$([regex]::Escape($packageVersion))(-[0-9A-Za-z.-]+)?$") {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Require Windows signing secrets for publishing
        if: inputs.publish
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_EXPECTED_PUBLISHER: ${{ secrets.WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_EXPECTED_PUBLISHER)) {
            throw "Publishing requires WINDOWS_CERTIFICATE_BASE64, WINDOWS_CERTIFICATE_PASSWORD, and WINDOWS_EXPECTED_PUBLISHER secrets."
          }

      - name: Package Windows app
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run package:win

      - name: Verify published Windows signature
        if: inputs.publish
        shell: pwsh
        env:
          WINDOWS_EXPECTED_PUBLISHER: ${{ secrets.WINDOWS_EXPECTED_PUBLISHER }}
        run: |
          $installer = Get-ChildItem release/EasyOpen-*-Setup.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') {
            throw "Invalid Authenticode signature: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notlike "*$env:WINDOWS_EXPECTED_PUBLISHER*") {
            throw "Unexpected Windows publisher: $($signature.SignerCertificate.Subject)"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-windows
          path: easyopen-desktop/release/EasyOpen-*-Setup.exe
          if-no-files-found: error

  package-android:
    needs: release-metadata
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyopen-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: easyopen-android/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Android signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.EASYOPEN_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Generate Android project
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easyopen-release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          EASYOPEN_KEYSTORE_PATH: ${{ runner.temp }}/easyopen-release.jks
          EASYOPEN_KEY_ALIAS: ${{ secrets.EASYOPEN_ANDROID_KEY_ALIAS }}
          EASYOPEN_KEYSTORE_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_PASSWORD }}
          EASYOPEN_KEY_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Name Android APK
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: mv android/app/build/outputs/apk/release/app-release.apk "EasyOpen-Android-${RELEASE_TAG#easyopen-v}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-android
          path: easyopen-android/EasyOpen-Android-*.apk
          if-no-files-found: error

  prepare-release-assets:
    needs: [release-metadata, package-windows, package-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v4
        with:
          pattern: easyopen-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: sha256sum EasyOpen-* > SHA256SUMS.txt

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-release-candidate-${{ needs.release-metadata.outputs.release_tag }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  create-prerelease:
    if: ${{ inputs.publish }}
    needs: [release-metadata, prepare-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: easyopen-release-candidate-${{ needs.release-metadata.outputs.release_tag }}
          path: release-assets

      - name: Reject an existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Create public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.release_tag }}
        run: |
          cat > release-notes.md <<'EOF'
          ## EasyOpen beta

          Beta build for controlled testing. Both platforms still require real-device validation.

          - Windows EXE is unsigned and may show an unrecognized publisher warning.
          - Android APK is signed with the configured EasyOpen release key.
          - Verify downloads against `SHA256SUMS.txt`.
          - Windows 11 installation/update/removal and Galaxy installation/store-link testing remain required.
          EOF
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EasyOpen $RELEASE_TAG" \
            --notes-file release-notes.md \
            --prerelease
