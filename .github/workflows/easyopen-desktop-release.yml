name: Draft EasyOpen app release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (must match easyopen-desktop/package.json version)"
        required: true
        default: "v0.1.0-beta.1"
        type: string

permissions:
  contents: write

concurrency:
  group: easyopen-app-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: easyopen-desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: easyopen-desktop/package-lock.json

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch "^v$([regex]::Escape($packageVersion))(-[0-9A-Za-z.-]+)?$") {
            throw "Tag $env:RELEASE_TAG does not match package version $packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Package unsigned Windows beta
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-windows
          path: easyopen-desktop/release/EasyOpen-*-Setup.exe
          if-no-files-found: error

  package-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: easyopen-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: easyopen-android/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Android signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.EASYOPEN_ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easyopen-release.jks"

      - name: Build signed release APK
        shell: bash
        env:
          EASYOPEN_KEYSTORE_PATH: ${{ runner.temp }}/easyopen-release.jks
          EASYOPEN_KEY_ALIAS: ${{ secrets.EASYOPEN_ANDROID_KEY_ALIAS }}
          EASYOPEN_KEYSTORE_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEYSTORE_PASSWORD }}
          EASYOPEN_KEY_PASSWORD: ${{ secrets.EASYOPEN_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Name Android APK
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: mv android/app/build/outputs/apk/release/app-release.apk "EasyOpen-Android-${RELEASE_TAG#v}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-android
          path: easyopen-android/EasyOpen-Android-*.apk
          if-no-files-found: error

  create-draft-release:
    needs: [package-windows, package-android]
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged apps
        uses: actions/download-artifact@v4
        with:
          pattern: easyopen-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: sha256sum EasyOpen-* > SHA256SUMS.txt

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cat > release-notes.md <<'EOF'
          ## EasyOpen beta

          Controlled testing build. Do not publish this draft until both platforms pass real-device testing.

          - Windows EXE is unsigned and may show an unrecognized publisher warning.
          - Android APK is signed with the configured EasyOpen release key.
          - Verify downloads against `SHA256SUMS.txt`.
          - Windows 11 installation/update/removal and Galaxy installation/store-link testing remain required.
          EOF
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EasyOpen $RELEASE_TAG" \
            --notes-file release-notes.md \
            --draft \
            --prerelease
