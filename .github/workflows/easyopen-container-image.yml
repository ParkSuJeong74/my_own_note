name: Build EasyOpen container image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the verified CosyVoice image to GHCR and sign it"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: easyopen-cosyvoice-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restrict registry publishing to master
        if: ${{ inputs.publish && github.ref != 'refs/heads/master' }}
        shell: bash
        run: |
          echo "GHCR publishing is allowed only from refs/heads/master." >&2
          exit 1

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/easyopen-cosyvoice" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build candidate for security checks
        uses: docker/build-push-action@v6.18.0
        with:
          context: easyopen-containers/cosyvoice
          file: easyopen-containers/cosyvoice/Dockerfile
          load: true
          push: false
          tags: easyopen-cosyvoice:scan-${{ github.sha }}
          cache-from: type=gha,scope=easyopen-cosyvoice
          cache-to: type=gha,mode=max,scope=easyopen-cosyvoice

      - name: Record HIGH and CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easyopen-cosyvoice:scan-${{ github.sha }}
          format: table
          output: trivy-report.txt
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easyopen-cosyvoice:scan-${{ github.sha }}
          format: cyclonedx
          output: cosyvoice-sbom.cdx.json
          exit-code: "0"

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-cosyvoice-verification-${{ github.sha }}
          path: |
            trivy-report.txt
            cosyvoice-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Reject fixed HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easyopen-cosyvoice:scan-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish }}
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image
        if: ${{ inputs.publish }}
        id: push
        uses: docker/build-push-action@v6.18.0
        with:
          context: easyopen-containers/cosyvoice
          file: easyopen-containers/cosyvoice/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:candidate-${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=easyopen-cosyvoice

      - name: Attest published image provenance
        if: ${{ inputs.publish }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        if: ${{ inputs.publish }}
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign published digest with GitHub OIDC
        if: ${{ inputs.publish }}
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify published signature identity
        if: ${{ inputs.publish }}
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Create Desktop digest manifest
        if: ${{ inputs.publish }}
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          printf '{\n  "cosyvoice": "%s@%s"\n}\n' "$IMAGE" "$DIGEST" > container-images.json

      - name: Upload Desktop digest manifest
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-cosyvoice-desktop-manifest-${{ github.sha }}
          path: container-images.json
          if-no-files-found: error
          retention-days: 30

      - name: Write workflow summary
        if: ${{ inputs.publish }}
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## CosyVoice candidate image"
            echo
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Verification evidence and Desktop manifest are attached to this run."
            echo "- Do not mark the image supported until Windows 11 NVIDIA testing passes."
          } >> "$GITHUB_STEP_SUMMARY"
