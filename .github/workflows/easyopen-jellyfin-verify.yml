name: "[AUTO] EasyOpen · Verify Jellyfin Supply Chain"
run-name: "[AUTO] Jellyfin supply-chain · ${{ github.event_name }} · ${{ github.ref_name }}"

on:
  push:
    branches: [master]
    paths:
      - "easyopen/containers/jellyfin/**"
      - "easyopen/apps/catalog/container-images.json"
      - "easyopen/apps/desktop/resources/container-images.json"
      - ".github/workflows/easyopen-jellyfin-verify.yml"
      - ".github/workflows/easyopen-jellyfin-publish.yml"
  pull_request:
    paths:
      - "easyopen/containers/jellyfin/**"
      - "easyopen/apps/catalog/container-images.json"
      - "easyopen/apps/desktop/resources/container-images.json"
      - ".github/workflows/easyopen-jellyfin-verify.yml"
      - ".github/workflows/easyopen-jellyfin-publish.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: easyopen-jellyfin-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve and validate locked image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          lock="easyopen/containers/jellyfin/image-lock.json"
          source="$(jq -r '.repository + "@" + .digest' "$lock")"
          candidate="$(jq -r '.candidateRepository' "$lock")"
          if [[ ! "$source" =~ ^ghcr\.io/jellyfin/jellyfin@sha256:[a-f0-9]{64}$ ]]; then
            echo "The upstream image is not an approved Jellyfin GHCR digest." >&2
            exit 1
          fi
          if [[ ! "$candidate" =~ ^ghcr\.io/[a-z0-9-]+/easyopen-app-jellyfin$ ]]; then
            echo "The candidate repository is not an approved EasyOpen GHCR path." >&2
            exit 1
          fi
          test "$(jq -r '.license' "$lock")" = "GPL-2.0"
          test -s easyopen/containers/jellyfin/COMPLIANCE.md
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Verify locked multi-architecture manifest
        shell: bash
        env:
          SOURCE_IMAGE: ${{ steps.image.outputs.source }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$SOURCE_IMAGE" > manifest.txt
          grep -q 'Platform:.*linux/amd64' manifest.txt
          grep -q 'Platform:.*linux/arm64' manifest.txt

      - name: Pull amd64 candidate for scanning
        shell: bash
        env:
          SOURCE_IMAGE: ${{ steps.image.outputs.source }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" easyopen-jellyfin-scan:amd64

      - name: Scan amd64 fixed HIGH and CRITICAL vulnerabilities
        id: scan-amd64
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easyopen-jellyfin-scan:amd64
          format: table
          output: trivy-amd64.txt
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 20m0s

      - name: Generate amd64 CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easyopen-jellyfin-scan:amd64
          format: cyclonedx
          output: jellyfin-amd64.cdx.json
          exit-code: "0"
          scanners: vuln
          timeout: 20m0s

      - name: Pull arm64 candidate for scanning
        shell: bash
        env:
          SOURCE_IMAGE: ${{ steps.image.outputs.source }}
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" easyopen-jellyfin-scan:arm64

      - name: Scan arm64 fixed HIGH and CRITICAL vulnerabilities
        id: scan-arm64
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easyopen-jellyfin-scan:arm64
          format: table
          output: trivy-arm64.txt
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 20m0s

      - name: Generate arm64 CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easyopen-jellyfin-scan:arm64
          format: cyclonedx
          output: jellyfin-arm64.cdx.json
          exit-code: "0"
          scanners: vuln
          timeout: 20m0s

      - name: Assemble verification evidence
        shell: bash
        run: |
          set -euo pipefail
          cp easyopen/containers/jellyfin/image-lock.json .
          cp easyopen/containers/jellyfin/COMPLIANCE.md .

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: easyopen-jellyfin-verification-${{ github.sha }}
          path: |
            manifest.txt
            image-lock.json
            COMPLIANCE.md
            trivy-amd64.txt
            trivy-arm64.txt
            jellyfin-amd64.cdx.json
            jellyfin-arm64.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Reject fixed HIGH and CRITICAL vulnerabilities
        if: ${{ steps.scan-amd64.outcome != 'success' || steps.scan-arm64.outcome != 'success' }}
        shell: bash
        run: |
          echo "A fixed HIGH or CRITICAL vulnerability blocks this candidate." >&2
          exit 1
